name: build

on:
  push:
    branches:
      - "gcs-backup"

jobs:
  # https://github.com/charmbracelet/meta/blob/main/.github/workflows/build.yml
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
  # https://github.com/charmbracelet/meta/blob/main/.github/workflows/build.yml
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go mod tidy
      - run: govulncheck ./...
  test_postgres:
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ^1
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Test
        run: go test ./...
        env:
          SOFT_SERVE_DB_DRIVER: postgres
          SOFT_SERVE_DB_DATA_SOURCE: postgres://postgres:postgres@localhost/postgres?sslmode=disable
